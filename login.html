<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login | ISTrack ISFR-ARVI</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10; --surface:#12151b; --line:#242932;
    --text:#eef1f6; --muted:#7c8494; --dim:#454b57;
    --real:#e2323a; --real-100:#ffd9db;
    --font:'Space Grotesk', system-ui, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:var(--font);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .panel{width:100%; max-width:380px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none;}
  .brand-text .name{font-size:.86rem; font-weight:600; line-height:1.2;}
  .brand-text .role{font-family:var(--mono); font-size:.7rem; color:var(--muted); line-height:1.3;}

  h1{font-size:1.05rem; font-weight:600; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:.83rem; margin:0 0 24px; line-height:1.5;}
  .field{margin-bottom:16px;}
  label{display:block; font-size:.78rem; color:var(--muted); margin:0 0 6px;}
  input{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:10px 12px; font:inherit; font-size:.9rem;
  }
  input:focus{outline:none; border-color:var(--dim); box-shadow:0 0 0 3px rgba(255,255,255,.05);}
  .btn{
    margin-top:8px; width:100%; padding:14px; border:none; border-radius:8px;
    font:inherit; font-weight:600; font-size:.95rem; cursor:pointer;
    background:var(--text); color:var(--bg);
  }
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn:active:not(:disabled){transform:translateY(1px);}
  .readout{
    margin-top:14px; padding:10px 12px; border-radius:6px; font-family:var(--mono); font-size:.78rem;
    display:none; border-left:3px solid var(--line); background:var(--surface); line-height:1.5;
  }
  .readout.show{display:block;}
  .readout.err{border-left-color:var(--real); color:var(--real-100);}
</style>
</head>
<body>

<div class="panel">
  <div class="brand">
    <span class="dot"></span>
    <div class="brand-text">
      <div class="name">ISTrack / ISFR-ARVI</div>
      <div class="role">manual alarm console</div>
    </div>
  </div>

  <h1>Admin login</h1>
  <p class="sub">Masuk untuk memicu alarm gempa manual.</p>

  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn" id="loginBtn" type="submit">Masuk</button>
    <div class="readout" id="status"></div>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
const statusEl = document.getElementById('status');

function setError(msg){
  statusEl.className = 'readout show err';
  statusEl.textContent = msg;
}

form.addEventListener('submit', async function(e){
  e.preventDefault();
  btn.disabled = true;
  statusEl.className = 'readout';

  try {
    const res = await fetch('/.netlify/functions/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok){
      setError(data.error || 'Login gagal.');
      btn.disabled = false;
      return;
    }
    window.location.href = 'admin.html';
  } catch (err){
    setError('Error jaringan: ' + err.message);
    btn.disabled = false;
  }
});
</script>

</body>
</html>
